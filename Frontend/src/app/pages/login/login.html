<main class="login-shell">
  <section class="brand-panel">
    <div class="brand-mark">SPA-FISI</div>
    <p class="eyebrow">SISTEMA DE PLANIFICACIÓN ACADÉMICA</p>
    <h1>Hagamos la planificación juntos.</h1>
    <p class="brand-copy">Organiza demanda, secciones, horarios.</p>
  </section>
  <section class="login-panel">
    <form class="login-card" (ngSubmit)="submit()">
      <p class="eyebrow dark">ACCESO</p>
      <h2>Iniciar sesión</h2>
      <p class="muted">
        (Mientras no haya autenticación institucional, usa el UUID de un usuario existente.)
      </p>
      <label>Correo<input name="email" [(ngModel)]="email" type="email" required /></label
      ><label
        >UUID de usuario<input
          name="userId"
          [(ngModel)]="userId"
          placeholder="UUID registrado en la base de datos"
          required /></label
      ><label
        >Contraseña<input name="password" [(ngModel)]="password" type="password" required /></label
      ><button class="primary full">Ingresar →</button>
    </form>
  </section>
</main>
