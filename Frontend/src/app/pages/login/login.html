<main class="login-shell">
  <section class="brand-panel">
    <div class="brand-mark">SPA-FISI</div>
    <p class="eyebrow">SISTEMA DE PLANIFICACIÓN ACADÉMICA</p>
    <h1>Hagamos la planificación juntos.</h1>
    <p class="brand-copy">Organiza demanda, secciones, horarios.</p>
  </section>
  <section class="login-panel">
    <form class="login-card" (ngSubmit)="submit()">
      <p class="eyebrow dark">ACCESO</p>
      <h2>Iniciar sesión</h2>
      <label>Correo<input name="correo" [(ngModel)]="correo" type="text" required /></label>
      <label>Clave<input name="clave" [(ngModel)]="clave" type="password" required /></label>
      @if (error()) {
        <p class="error" role="alert">{{ error() }}</p>
      }
      <button class="primary full" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Ingresar →' }}
      </button>
      <p class="muted">
        ¿Aún no tienes usuario? <a routerLink="/crear-usuario">Crear usuario</a>
      </p>
    </form>
  </section>
</main>
