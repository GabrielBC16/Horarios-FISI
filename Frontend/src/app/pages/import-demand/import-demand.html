<main class="page">
  <a [routerLink]="['/planificaciones', planId, 'programacion']" class="back"
    >← Volver a la planificación</a
  >
  <section class="form-card">
    <p class="eyebrow">PASO 2 DE 4</p>
    <h1>Importar demanda</h1>
    <p>
      Sube el PDF enlazado a esta planificación. Antes de confirmar podrás ver todos los cursos
      extraídos, incluidos los que presenten errores.
    </p>
    <label class="drop"
      ><input type="file" accept="application/pdf" (change)="select($event)" /><span>PDF</span
      ><strong>{{ file()?.name || 'Selecciona el reporte de demanda' }}</strong
      ><small>Solo PDF, máximo 10 MB</small></label
    >
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    <button class="primary" [disabled]="!file() || loading()" (click)="upload()">
      Procesar PDF →
    </button>
  </section>
</main>
<app-loading-progress
  [active]="loading()"
  title="Estamos analizando tu reporte"
  description="El PDF puede contener varias tablas y el análisis tarda alrededor de dos minutos. La solicitud sigue activa mientras ves este mensaje."
  [stages]="importStages"
/>
