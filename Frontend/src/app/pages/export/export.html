<main class="page">
  <a [routerLink]="['/planificaciones', planId, 'programacion']" class="back"
    >← Volver a programación</a
  >
  <a [routerLink]="['/dashboard']" class="back">Volver a Pantalla Principal</a>
  <section class="form-card export">
    <span class="check">✓</span>
    <p class="eyebrow">PROGRAMACIÓN COMPLETA</p>
    <h1>Exportar a Excel</h1>
    <p>
      Se generará el archivo excel con cursos, secciones, cupos por plan, docentes y bloques de
      horario.
    </p>
    <button class="primary" [disabled]="downloading()" (click)="download()">
      {{ downloading() ? 'Generando archivo...' : '⇩ Descargar Excel' }}
    </button>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
  </section>
</main>
